</head>
<body>
<div class="app">
    <div class="sidebar-overlay"></div>
    <aside class="sidebar">
        <div class="sidebar-header"><div class="sidebar-logo">⚡</div><span class="sidebar-brand">TaskFlow</span></div>
        <nav class="sidebar-nav"><div class="nav-section"><div class="nav-section-title">Menu</div>
            <a href="dashboard.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Dashboard</a>
            <a href="tasks.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>Tasks</a>
            <a href="calendar.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Calendar</a>
            <a href="team.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4-4v2"/><circle cx="9" cy="7" r="4"/></svg>Team</a>
            <a href="meetings.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>Meetings</a>
            <a href="notes.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>Notes</a>
            <a href="database.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>Database Admin</a>
        </div><div class="nav-section"><div class="nav-section-title">Account</div>
            <a href="profile.html" class="nav-link active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profile</a>
            <a href="#" class="nav-link logout-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Logout</a>
        </div></nav>
        <div class="sidebar-footer"><div class="sidebar-user"><div class="avatar">AU</div><div class="sidebar-user-info"><div class="sidebar-user-name">User</div><div class="sidebar-user-role">member</div></div></div></div>
    </aside>
    <main class="main-content">
        <header class="top-bar">
            <div class="top-bar-left"><button class="menu-toggle">☰</button><span class="page-title">Profile</span></div>
            <div class="top-bar-right"><button class="theme-toggle">🌙</button><button class="notification-btn">🔔<span class="notification-badge" style="display:none">0</span></button></div>
        </header>
        <div class="content">
            <div class="profile-container">
                <div class="card" style="margin-bottom:var(--space-lg)">
                    <div class="profile-header">
                        <div class="avatar avatar-xl" id="profileAvatar">AU</div>
                        <div>
                            <h2 id="profileName">Loading...</h2>
                            <p id="profileEmail" class="text-muted">Loading...</p>
                            <span class="badge badge-medium" id="profileRole">member</span>
                        </div>
                    </div>
                </div>
                <div class="card">
                    <h3 style="margin-bottom:var(--space-lg)">Edit Profile</h3>
                    <form id="profileForm" class="profile-form">
                        <div class="form-group"><label for="profileNameInput">Full Name</label><input type="text" id="profileNameInput"></div>
                        <div class="form-group"><label for="profileEmailInput">Email</label><input type="email" id="profileEmailInput"></div>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </form>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="js/api.js"></script><script src="js/utils.js"></script><script src="js/theme.js"></script><script src="js/sidebar.js"></script><script src="js/notifications.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    try {
        const user = await api.get('/auth/profile');
        document.getElementById('profileName').textContent = user.name;
        document.getElementById('profileEmail').textContent = user.email;
        document.getElementById('profileRole').textContent = user.role;
        document.getElementById('profileAvatar').textContent = utils.getInitials(user.name);
        document.getElementById('profileNameInput').value = user.name;
        document.getElementById('profileEmailInput').value = user.email;
    } catch (e) {}

    document.getElementById('profileForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
            const data = await api.put('/auth/profile', {
                name: document.getElementById('profileNameInput').value,
                email: document.getElementById('profileEmailInput').value
            });
            utils.showToast('Profile updated!', 'success');
            localStorage.setItem('taskflow_user', JSON.stringify(data.user));
            document.getElementById('profileName').textContent = data.user.name;
            document.getElementById('profileEmail').textContent = data.user.email;
            document.getElementById('profileAvatar').textContent = utils.getInitials(data.user.name);
        } catch (err) { utils.showToast(err.message, 'error'); }
    });
});
</script>
</body>
</html>
