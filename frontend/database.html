<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Admin - TaskFlow</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/database.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="app">
    <div class="sidebar-overlay"></div>
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">⚡</div>
            <span class="sidebar-brand">TaskFlow</span>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section">
                <div class="nav-section-title">Menu</div>
                <a href="dashboard.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Dashboard</a>
                <a href="tasks.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>Tasks</a>
                <a href="calendar.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Calendar</a>
                <a href="team.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4-4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>Team</a>
                <a href="meetings.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15.05 5A5 5 0 0119 8.95M15.05 1A9 9 0 0123 8.94M2 16.1A5 5 0 015.9 12M2 20a9 9 0 013.9-7.05"/><line x1="2" y1="2" x2="22" y2="22"/></svg>Meetings</a>
                <a href="notes.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>Notes</a>
                <a href="database.html" class="nav-link active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>Database Admin</a>
            </div>
            <div class="nav-section">
                <div class="nav-section-title">Account</div>
                <a href="profile.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profile</a>
                <a href="#" class="nav-link logout-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Logout</a>
            </div>
        </nav>
        <div class="sidebar-footer">
            <div class="sidebar-user">
                <div class="avatar">AU</div>
                <div class="sidebar-user-info">
                    <div class="sidebar-user-name">User</div>
                    <div class="sidebar-user-role">member</div>
                </div>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <header class="top-bar">
            <div class="top-bar-left">
                <button class="menu-toggle">☰</button>
                <span class="page-title">Database Admin</span>
            </div>
            <div class="top-bar-right">
                <button class="theme-toggle" title="Toggle theme">🌙</button>
            </div>
        </header>

        <div class="content">
            <div class="db-container animate-fade">
                <!-- Tables List -->
                <div class="db-sidebar">
                    <div class="db-sidebar-header">Tables</div>
                    <ul class="db-table-list" id="tableList">
                        <!-- Populated via JS -->
                        <div class="spinner" style="margin: 20px auto;"></div>
                    </ul>
                </div>

                <!-- Table Data -->
                <div class="db-content">
                    <div class="db-content-header" style="flex-direction: column; align-items: stretch; gap: 10px;">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <h2 class="db-content-title" id="currentTableName">Select a table</h2>
                            <div>
                                <span id="saveStatus" style="color: var(--success-color); font-size: 0.9rem; margin-right: 15px; opacity: 0; transition: opacity 0.3s;">Saved!</span>
                                <button class="btn btn-primary" id="refreshBtn" disabled>Refresh Data</button>
                            </div>
                        </div>
                        <div style="display: flex; gap: 10px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border-color);">
                            <textarea id="customQueryInput" placeholder="Enter custom SQL query (e.g. SELECT * FROM users WHERE role='admin')" style="flex-grow: 1; min-height: 40px; padding: 8px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--bg-body); color: var(--text-primary); font-family: monospace; resize: vertical;"></textarea>
                            <button class="btn btn-primary" id="runQueryBtn" style="white-space: nowrap; align-self: flex-start;">Run Query</button>
                        </div>
                    </div>
                    <div class="db-data-container" id="dataContainer">
                        <div class="db-empty-state">No table selected</div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/theme.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/database.js"></script>
</body>
</html>
